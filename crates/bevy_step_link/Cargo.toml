[package]
name = "bevy_step_link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bevy integration for step_link: AssetLoader importing STEP (.step/.stp) CAD files as Mesh."
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/bevy_step_link"
readme.workspace = true
keywords = ["bevy", "step", "cad", "asset", "mesh"]
categories = ["game-development", "graphics", "rendering::data-formats"]

[dependencies]
step_link.workspace = true
bevy = { workspace = true, features = ["bevy_asset", "bevy_render", "bevy_log"] }

[dev-dependencies]
bevy = "0.20"